<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terra Médiévale</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="globe"></canvas>
<canvas id="map" class="hidden-layer"></canvas>
<div id="reticle" class="hidden"></div>

<!-- Écran titre -->
<div id="title" class="overlay">
  <div class="title-box">
    <div class="title-crest"></div>
    <h1>Terra Médiévale</h1>
    <p class="subtitle">Fonde ta ville n'importe où sur la Terre, à taille réelle.</p>
    <div class="title-buttons">
      <button id="btn-continue" class="btn big hidden">Continuer</button>
      <button id="btn-new" class="btn big">Nouvelle partie</button>
    </div>
    <div class="title-buttons" style="margin-top:12px">
      <button id="btn-mp" class="btn big green">Multijoueur en ligne</button>
    </div>
    <p class="credits">Géographie réelle : Natural Earth · relief NASA</p>
  </div>
</div>

<!-- Interface du globe -->
<div id="globe-ui" class="hidden">
  <div id="search-box" class="panel">
    <input id="search" type="text" placeholder="Chercher un lieu (ex : Paris, Montevideo)…" autocomplete="off" spellcheck="false">
    <div id="search-results"></div>
  </div>
  <div id="globe-hint" class="panel small">Glisse pour tourner · Molette pour zoomer · Double-clic pour plonger · Zoome au maximum pour voir la carte</div>
  <div id="globe-coords" class="panel small"></div>
  <div id="globe-buttons">
    <button id="btn-gocity" class="btn hidden">Retour à ma ville</button>
    <button id="btn-globe-menu" class="btn">Menu</button>
  </div>
</div>

<!-- Interface de la carte -->
<div id="map-ui" class="hidden">
  <div id="topbar" class="panel">
    <div id="city-title"><img id="rank-icon" alt=""><div><div id="city-name"></div><div id="city-rank"></div></div></div>
    <div id="resources"></div>
    <div id="top-right">
      <div id="date"></div>
      <div id="speed">
        <button class="btn tiny" data-speed="0" title="Pause (Espace)">❚❚</button>
        <button class="btn tiny" data-speed="1" title="Vitesse normale">▶</button>
        <button class="btn tiny" data-speed="3" title="Rapide">▶▶</button>
        <button class="btn tiny" data-speed="8" title="Très rapide">▶▶▶</button>
      </div>
      <button id="btn-sound" class="btn tiny" title="Son">♪</button>
      <button id="btn-toglobe" class="btn small" title="Revenir au globe">Globe</button>
      <button id="btn-menu" class="btn small">Menu</button>
    </div>
  </div>

  <div id="explore-bar" class="panel hidden">
    <div id="explore-text"></div>
    <div id="site-eval"></div>
    <div class="row">
      <button id="btn-found" class="btn big">Fonder ma ville ici</button>
    </div>
  </div>

  <div id="objectives" class="panel hidden"></div>
  <div id="info" class="panel hidden"></div>
  <div id="tile-info" class="panel small hidden"></div>

  <div id="buildbar" class="panel hidden">
    <div id="build-tabs"></div>
    <div id="build-list"></div>
    <div id="build-tools">
      <button id="btn-lord" class="btn small gold" title="Incarner ton seigneur et te déplacer à vitesse réelle (L)">👑 Seigneur</button>
      <button id="btn-registry" class="btn small" title="Registre des habitants, défunts et chronique (R)">📜 Registre</button>
      <button id="btn-war" class="btn small red" title="Guerre, armée &amp; diplomatie (G)">⚔ Guerre</button>
      <button id="btn-center" class="btn small" title="Centrer sur la ville (C)">⌂ Ville</button>
      <button id="btn-demolish" class="btn small" title="Démolir (Suppr)">Démolir</button>
    </div>
  </div>
  <div id="lord-hud" class="panel hidden"></div>
  <div id="toasts"></div>
</div>

<!-- Multijoueur : joueurs + chat (globe et carte) -->
<div id="mp-ui">
  <div id="mp-players" class="panel"></div>
  <div id="mp-chat" class="panel"><div id="chat-log"></div><input id="chat-input" type="text" maxlength="300" placeholder="Écris un message… (Entrée)" autocomplete="off"></div>
</div>

<div id="war" class="panel hidden"></div>

<div id="loader" class="overlay hidden"><div class="loader-box"><div class="spinner"></div><div id="loader-text">Chargement…</div></div></div>
<div id="modal" class="overlay hidden"><div class="modal-box panel"></div></div>

<script type="importmap">{ "imports": { "three": "./lib/three.module.min.js" } }</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
